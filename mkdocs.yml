site_name: Baleen
site_description: >-
  Hierarchical Bayesian framework for RNA modification detection from
  nanopore direct RNA sequencing.
site_author: Logan Chen
site_url: https://loganylchen.github.io/py-baleen/
repo_name: loganylchen/py-baleen
repo_url: https://github.com/loganylchen/py-baleen
edit_uri: edit/dev/docs/
copyright: Copyright &copy; Logan Chen — MIT License

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - User Guide:
      - Pipeline Overview: guide/overview.md
      - Inputs: guide/inputs.md
      - Outputs: guide/outputs.md
      - CLI Reference: guide/cli.md
      - Interpreting & Filtering Results: guide/filtering.md
      - HMM Training Modes: guide/hmm-training.md
      - Performance & Scaling: guide/performance.md
      - Docker: guide/docker.md
  - API Reference:
      - Overview: api/index.md
      - Pipeline: api/pipeline.md
      - Aggregation: api/aggregation.md
      - Modification Probabilities: api/probability.md
      - HMM Training: api/hmm.md
      - Read I/O (mod-BAM): api/io.md
      - Read-ID Intersection: api/read_ids.md
  - Contributing: contributing.md
  - Changelog: changelog.md

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/loganylchen/py-baleen
