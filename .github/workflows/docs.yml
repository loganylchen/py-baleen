name: Docs

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "baleen/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for the same ref.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: |
          pip install ".[docs]"
          # krill (engine) is not on PyPI; mkdocstrings imports baleen, which
          # imports it. Install the CPU wheel from the project index.
          pip install numpy scipy pyslow5 pyfastx
          pip install krill --no-deps \
            --index-url https://loganylchen.github.io/krill-dist/simple/

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    # Publish from the primary development branch (dev), not from PRs.
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
