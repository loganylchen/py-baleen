name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install and test
        run: |
          pip install ".[test]"
          # krill (DTW + eventalign engine) is not on PyPI — install the CPU
          # wheel from the project index. Its runtime deps come from PyPI first.
          pip install numpy scipy pyslow5 pyfastx
          pip install krill --no-deps \
            --index-url https://loganylchen.github.io/krill-dist/simple/
          pytest

  # Both images live in a single repository `py-baleen`; the variant is a tag
  # suffix, e.g. dev-cpu / dev-gpu / latest-cpu / latest-gpu / <sha>-cpu.
  # Published to Docker Hub (${DH_USER}/py-baleen) and GHCR
  # (ghcr.io/<owner>/py-baleen, public).
  build-cpu:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DH_USER }}
          password: ${{ secrets.DH_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DH_USER }}/py-baleen
            ghcr.io/${{ github.repository_owner }}/py-baleen
          # Global suffix applies to the branch/sha tags. The implicit latest
          # is disabled (latest=false) to avoid a bare `:latest` that the two
          # variant jobs would overwrite; instead the latest tag is declared
          # explicitly with a PER-TAG suffix (global suffix/onlatest do not
          # apply to an explicit raw latest) and gated to the default branch.
          flavor: |
            latest=false
            suffix=-cpu
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=long
            type=raw,value=latest,suffix=-cpu,enable={{is_default_branch}}

      - name: Build and push CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cpu
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-gpu:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DH_USER }}
          password: ${{ secrets.DH_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DH_USER }}/py-baleen
            ghcr.io/${{ github.repository_owner }}/py-baleen
          # Global suffix applies to the branch/sha tags. The implicit latest
          # is disabled (latest=false) to avoid a bare `:latest` that the two
          # variant jobs would overwrite; instead the latest tag is declared
          # explicitly with a PER-TAG suffix (global suffix/onlatest do not
          # apply to an explicit raw latest) and gated to the default branch.
          flavor: |
            latest=false
            suffix=-gpu
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=long
            type=raw,value=latest,suffix=-gpu,enable={{is_default_branch}}

      - name: Build and push GPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gpu
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
