name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install and test
        run: |
          # CPU-only build (no nvcc on the runner); f5c is mocked in the tests,
          # so no f5c binary is required here.
          BALEEN_NO_CUDA=1 pip install ".[test]"
          pytest

  # Both images live in a single repository `py-baleen`; the variant is a tag
  # suffix, e.g. dev-cpu / dev-gpu / latest-cpu / latest-gpu / <sha>-cpu.
  # Published to Docker Hub (${DH_USER}/py-baleen) and GHCR
  # (ghcr.io/<owner>/py-baleen, public).
  build-cpu:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DH_USER }}
          password: ${{ secrets.DH_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # New single repo `py-baleen`: variant is a tag SUFFIX (-cpu). latest=false
      # avoids a bare `:latest`; the explicit raw latest carries a per-tag suffix
      # and is gated to the default branch (main) -> latest-cpu.
      - name: Extract metadata (py-baleen, suffix -cpu)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DH_USER }}/py-baleen
            ghcr.io/${{ github.repository_owner }}/py-baleen
          flavor: |
            latest=false
            suffix=-cpu
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=long
            type=raw,value=latest,suffix=-cpu,enable={{is_default_branch}}

      # Legacy repo `py-baleen-cpu`: the variant is the REPO name, so NO suffix.
      # latest=auto does not synthesize `latest` for branch/sha generators, so
      # declare it explicitly and gate to the default branch (refreshes the
      # legacy :latest on main pushes for back-compat pulls).
      - name: Extract metadata (legacy py-baleen-cpu)
        id: meta_legacy
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DH_USER }}/py-baleen-cpu
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cpu
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta_legacy.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-gpu:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DH_USER }}
          password: ${{ secrets.DH_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # New single repo `py-baleen`: variant is a tag SUFFIX (-gpu). latest=false
      # avoids a bare `:latest`; the explicit raw latest carries a per-tag suffix
      # and is gated to the default branch (main) -> latest-gpu.
      - name: Extract metadata (py-baleen, suffix -gpu)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DH_USER }}/py-baleen
            ghcr.io/${{ github.repository_owner }}/py-baleen
          flavor: |
            latest=false
            suffix=-gpu
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=long
            type=raw,value=latest,suffix=-gpu,enable={{is_default_branch}}

      # Legacy repo `py-baleen-gpu`: the variant is the REPO name, so NO suffix.
      # latest=auto does not synthesize `latest` for branch/sha generators, so
      # declare it explicitly and gate to the default branch (refreshes the
      # legacy :latest on main pushes for back-compat pulls).
      - name: Extract metadata (legacy py-baleen-gpu)
        id: meta_legacy
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DH_USER }}/py-baleen-gpu
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push GPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gpu
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta_legacy.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
