[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baleen"
version = "0.4.0"
description = "Hierarchical Bayesian framework for RNA modification detection from nanopore direct RNA sequencing"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Logan Chen"},
]
keywords = ["nanopore", "RNA-modifications", "DTW", "CUDA", "HMM", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# NOTE: the DTW + eventalign engine 'krill' is a required runtime dependency
# but is NOT on PyPI — install it from the project index, e.g.
#   pip install krill --no-deps \
#     --index-url https://loganylchen.github.io/krill-dist/cu122/simple/   (GPU)
#   pip install krill --no-deps \
#     --index-url https://loganylchen.github.io/krill-dist/simple/         (CPU)
# or use a prebuilt baleen Docker image. It is intentionally omitted below so a
# plain `pip install .` does not fail looking for it on PyPI.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.9",
    "pysam>=0.21",
    "tqdm>=4.60",
    "pandas>=1.5",
    "pyslow5",
    "pyfastx",
]

[project.urls]
Homepage = "https://github.com/loganylchen/py-baleen"
Documentation = "https://loganylchen.github.io/py-baleen/"
Repository = "https://github.com/loganylchen/py-baleen.git"
Issues = "https://github.com/loganylchen/py-baleen/issues"

[project.optional-dependencies]
test = ["pytest>=7.0"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "pymdown-extensions>=10.0",
    "black>=24.0",
]

[project.scripts]
baleen = "baleen.cli:main"

[tool.setuptools.packages.find]
include = ["baleen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
